<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistem Laundry Sederhana</title>
  <!-- Modul 5: Tailwind CSS via CDN untuk mempercantik tampilan dengan mudah -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Modul 3: Menghubungkan file style.css -->
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-100 p-6">

  <div class="max-w-2xl mx-auto bg-white p-6 rounded-xl shadow-md">
    <!-- Judul Halaman -->
    <h1 class="text-2xl font-bold text-blue-600 mb-4 text-center">🧺 Sistem Laundry WashFlow</h1>

    <!-- FORM INPUT (Modul 2 & 6: Form & Event Handling) -->
    <form id="form-laundry" class="space-y-3 mb-6 bg-slate-50 p-4 rounded-lg border">
      <div>
        <label class="block text-sm font-semibold mb-1">Nama Pelanggan:</label>
        <input type="text" id="input-nama" required placeholder="Contoh: Budi" class="w-full p-2 border rounded">
      </div>

      <div>
        <label class="block text-sm font-semibold mb-1">Berat Cucian (Kg):</label>
        <input type="number" id="input-berat" min="1" step="0.5" value="1" required class="w-full p-2 border rounded">
      </div>

      <!-- Total Harga Otomatis (Modul 6: Operator Aritmatika) -->
      <div class="flex justify-between font-bold text-sm text-slate-700 pt-2">
        <span>Tarif: Rp 8.000 / Kg</span>
        <span>Total: <span id="text-total" class="text-blue-600">Rp 8.000</span></span>
      </div>

      <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 rounded">
        + Tambah Cucian
      </button>
    </form>

    <!-- TABEL DAFTAR CUCIAN (Modul 2 & 6: Manipulasi DOM) -->
    <h2 class="text-lg font-bold mb-2">Daftar Pesanan:</h2>
    <div class="overflow-x-auto">
      <table class="w-full text-left text-sm border-collapse border">
        <thead class="bg-slate-200">
          <tr>
            <th class="p-2 border">Nama</th>
            <th class="p-2 border">Berat</th>
            <th class="p-2 border">Total Biaya</th>
            <th class="p-2 border">Status</th>
            <th class="p-2 border text-center">Aksi</th>
          </tr>
        </thead>
        <tbody id="tabel-cucian">
          <!-- Data dari JavaScript akan muncul di sini -->
        </tbody>
      </table>
    </div>
  </div>

  <!-- Modul 6: Panggil script.js di akhir body -->
  <script src="script.js"></script>
</body>
</html>
